[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sike-too-slow"
version = "1.0.0"
description = "A dependency-light autonomous agent comedy desktop app"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ultimate-agent = "ultimate_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
